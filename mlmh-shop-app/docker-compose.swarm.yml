# Production Swarm configuration
services:
    mlmh_shop_app:
        build:
            target: production
        image: thegobc/mlmh_shop
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.mlmh_shop_app.rule=Host(`mlmh.gobc.fr`)'
            - 'traefik.http.routers.mlmh_shop_app.entrypoints=websecure'
            - 'traefik.http.routers.mlmh_shop_app.tls.certresolver=myresolver'
            - 'traefik.http.services.mlmh_shop_app.loadbalancer.server.port=3000'
        secrets:
            - DATABASE_URL
            - STRIPE_SECRET_KEY
            - BREVO_API_KEY
            - STRIPE_WEBHOOK_SECRET
            - MLMH_CLERK_SECRET_KEY
            - MLMH_SCW_REGION
            - MLMH_SCW_BUCKET_ENDPOINT
            - MLMH_SCW_DEFAULT_ORGANIZATION_ID
            - MLMH_SCW_DEFAULT_PROJECT_ID
            - MLMH_SCW_ACCESS_KEY
            - MLMH_SCW_SECRET_KEY
            - MLMH_SCW_BUCKET_NAME

        volumes:
            - uploads_data:/app/public/uploads
        environment:
            NODE_ENV: production
            PORT: 3000
            HOST: 0.0.0.0
        networks:
            - webnet

secrets:
    DATABASE_URL:
        external: true
    STRIPE_SECRET_KEY:
        external: true
    BREVO_API_KEY:
        external: true
    STRIPE_WEBHOOK_SECRET:
        external: true
    MLMH_CLERK_SECRET_KEY:
        external: true
    MLMH_SCW_REGION:
        external: true
    MLMH_SCW_BUCKET_ENDPOINT:
        external: true
    MLMH_SCW_DEFAULT_ORGANIZATION_ID:
        external: true
    MLMH_SCW_DEFAULT_PROJECT_ID:
        external: true
    MLMH_SCW_ACCESS_KEY:
        external: true
    MLMH_SCW_SECRET_KEY:
        external: true
    MLMH_SCW_BUCKET_NAME:
        external: true

volumes:
    uploads_data:

networks:
    webnet:
        external: true

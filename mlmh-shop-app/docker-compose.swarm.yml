# Production Swarm configuration
services:
    mlmh_shop_app:
        build:
            target: production
        image: thegobc/mlmh_shop
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s
                max_attempts: 3
                window: 120s
            resources:
                limits:
                    memory: 1G
                    cpus: '1'
                reservations:
                    memory: 256M
                    cpus: '0.5'
            update_config:
                parallelism: 1
                delay: 10s
                failure_action: rollback
                order: stop-first
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.mlmh_shop_app.rule=Host(`michel-lelong-guitar-tab-workshop.com`)'
            - 'traefik.http.routers.mlmh_shop_app.entrypoints=websecure'
            - 'traefik.http.routers.mlmh_shop_app.tls.certresolver=myresolver'
            - 'traefik.http.services.mlmh_shop_app.loadbalancer.server.port=3000'
        secrets:
            - DATABASE_URL
            - STRIPE_SECRET_KEY
            - BREVO_API_KEY
            - STRIPE_WEBHOOK_SECRET
            - MLMH_CLERK_SECRET_KEY
            - MLMH_SCW_REGION
            - MLMH_SCW_BUCKET_ENDPOINT
            - MLMH_SCW_DEFAULT_ORGANIZATION_ID
            - MLMH_SCW_DEFAULT_PROJECT_ID
            - MLMH_SCW_ACCESS_KEY
            - MLMH_SCW_SECRET_KEY
            - MLMH_SCW_BUCKET_NAME
            - MLMH_SCALEWAY_TABLATURES_BUCKET
            - REVALIDATE_API_KEY

        volumes:
            - uploads_data:/app/public/uploads
            - mlmh-next-cache:/app/.next/cache
        environment:
            NODE_ENV: production
            PORT: 3000
            HOST: 0.0.0.0
            CLERK_TELEMETRY_DISABLED: "1"
        networks:
            - webnet
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
    redirect_service:
        image: traefik/whoami:latest
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
        labels:
            - 'traefik.enable=true'
            # Rule for the root domain
            - 'traefik.http.routers.redirect_old_domain.rule=Host(`michel-lelong-music-house-shop.gobc.fr`)'
            - 'traefik.http.routers.redirect_old_domain.entrypoints=websecure'
            - 'traefik.http.routers.redirect_old_domain.tls.certresolver=myresolver'
            - 'traefik.http.routers.redirect_old_domain.middlewares=redirect-to-new-domain'

            # Rule for the www subdomain
            - 'traefik.http.routers.redirect_old_domain_www.rule=Host(`www.michel-lelong-music-house-shop.gobc.fr`)'
            - 'traefik.http.routers.redirect_old_domain_www.entrypoints=websecure'
            - 'traefik.http.routers.redirect_old_domain_www.tls.certresolver=myresolver'
            - 'traefik.http.routers.redirect_old_domain_www.middlewares=redirect-to-new-domain'

            # Shared redirect middleware for both domains
            - 'traefik.http.middlewares.redirect-to-new-domain.redirectregex.regex=^https?://(www\.)?michel-lelong-music-house-shop.gobc.fr/(.*)'
            - 'traefik.http.middlewares.redirect-to-new-domain.redirectregex.replacement=https://michel-lelong-guitar-tab-workshop.com/$${2}'
            - 'traefik.http.middlewares.redirect-to-new-domain.redirectregex.permanent=true'
secrets:
    DATABASE_URL:
        external: true
    STRIPE_SECRET_KEY:
        external: true
    BREVO_API_KEY:
        external: true
    STRIPE_WEBHOOK_SECRET:
        external: true
    MLMH_CLERK_SECRET_KEY:
        external: true
    MLMH_SCW_REGION:
        external: true
    MLMH_SCW_BUCKET_ENDPOINT:
        external: true
    MLMH_SCW_DEFAULT_ORGANIZATION_ID:
        external: true
    MLMH_SCW_DEFAULT_PROJECT_ID:
        external: true
    MLMH_SCW_ACCESS_KEY:
        external: true
    MLMH_SCW_SECRET_KEY:
        external: true
    MLMH_SCW_BUCKET_NAME:
        external: true
    MLMH_SCALEWAY_TABLATURES_BUCKET:
        external: true
    REVALIDATE_API_KEY:
        external: true
volumes:
    uploads_data:
    mlmh-next-cache:

networks:
    webnet:
        external: true

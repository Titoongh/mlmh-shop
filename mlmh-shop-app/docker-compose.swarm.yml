# Production Swarm configuration
services:
    mlmh_shop_app:
        build:
            target: production
        image: thegobc/mlmh_shop
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.mlmh_shop_app.rule=Host(`mlmh.gobc.fr`)'
            - 'traefik.http.routers.mlmh_shop_app.entrypoints=websecure'
            - 'traefik.http.routers.mlmh_shop_app.tls.certresolver=myresolver'
            - 'traefik.http.services.mlmh_shop_app.loadbalancer.server.port=3000'
        secrets:
            - DATABASE_URL
            - STRIPE_SECRET_KEY
            - BREVO_API_KEY
            - STRIPE_WEBHOOK_SECRET
        volumes:
            - uploads_data:/app/public/uploads
        environment:
            NODE_ENV: production
            PORT: 3000
            HOST: 0.0.0.0
        networks:
            - webnet

secrets:
    DATABASE_URL:
        external: true
    STRIPE_SECRET_KEY:
        external: true
    BREVO_API_KEY:
        external: true
    STRIPE_WEBHOOK_SECRET:
        external: true

volumes:
    uploads_data:

networks:
    webnet:
        external: true

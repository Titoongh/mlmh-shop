services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        ports:
            - '3000:3000'
        environment:
            NODE_ENV: development
            NEXT_PUBLIC_API_URL: http://localhost:3000
        volumes:
            - .:/app
            - ./node_modules:/app/node_modules
            - ./public/uploads:/app/public/uploads # Mount the named volume to the container's upload directory
        depends_on:
            - db

volumes:
    postgres-data:

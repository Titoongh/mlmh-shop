name: Sanity-check secrets

# Déclenchement manuel : onglet Actions → "Sanity-check secrets" → Run workflow.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Vérifier que les secrets sont renseignés (sans révéler les valeurs)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SSH_PRIVATE_KEY_NOPW: ${{ secrets.SSH_PRIVATE_KEY_NOPW }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          DATABASE_URL_BUILD: ${{ secrets.DATABASE_URL_BUILD }}
          STRIPE_SECRET_KEY_BUILD: ${{ secrets.STRIPE_SECRET_KEY_BUILD }}
        run: |
          set -u
          missing=0

          check() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "❌ $name : VIDE ou non défini"
              missing=$((missing + 1))
            else
              echo "✅ $name : len=${#value} sha256=$(printf '%s' "$value" | sha256sum | cut -c1-12)"
            fi
          }

          check DOCKER_USERNAME "$DOCKER_USERNAME"
          check DOCKER_PASSWORD "$DOCKER_PASSWORD"
          check SSH_PRIVATE_KEY_NOPW "$SSH_PRIVATE_KEY_NOPW"
          check SERVER_HOST "$SERVER_HOST"
          check SSH_PORT "$SSH_PORT"
          check SSH_USER "$SSH_USER"
          check NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          check NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          check NEXT_PUBLIC_BASE_URL "$NEXT_PUBLIC_BASE_URL"
          check NEXT_PUBLIC_API_URL "$NEXT_PUBLIC_API_URL"
          check DATABASE_URL_BUILD "$DATABASE_URL_BUILD"
          check STRIPE_SECRET_KEY_BUILD "$STRIPE_SECRET_KEY_BUILD"

          echo
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing secret(s) vide(s) ou manquant(s) dans l'environnement production"
            exit 1
          fi
          echo "Tous les secrets sont renseignés. 🎉"
